<!-- M3 PROJECT DETAIL MODAL DIALOG -->
<div id="project-modal-scrim" class="m3-dialog-scrim">
  <div class="m3-dialog-surface">
    <div class="m3-dialog-header">
      <span id="modal-category" class="section-badge">Category</span>
      <button id="close-modal-btn" class="icon-btn md-ripple" aria-label="Close Dialog">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <img id="modal-img" src="" alt="Project Detail Image" style="width: 100%; height: 260px; object-fit: cover; border-radius: var(--md-shape-corner-large); margin-bottom: 20px;" />

    <h2 id="modal-title" class="md-headline-large" style="margin-bottom: 4px; color: var(--md-sys-color-on-surface);">Project Title</h2>
    <p id="modal-subtitle" class="md-body-large" style="color: var(--md-sys-color-primary); font-weight: 600; margin-bottom: 16px;">Subtitle</p>

    <p id="modal-desc" class="md-body-medium" style="color: var(--md-sys-color-on-surface-variant); margin-bottom: 24px;">Description</p>

    <h4 class="md-title-medium" style="margin-bottom: 12px; color: var(--md-sys-color-on-surface);">Key Features & Modules:</h4>
    <ul id="modal-features" class="timeline-bullet-list" style="margin-bottom: 24px;"></ul>

    <h4 class="md-title-medium" style="margin-bottom: 12px; color: var(--md-sys-color-on-surface);">Tech Stack & Tools:</h4>
    <div id="modal-stack" class="project-tech-tags" style="margin-bottom: 28px;"></div>

    <div style="display: flex; gap: 12px; justify-content: flex-end;">
      <a id="modal-github-link" href="#" target="_blank" class="btn-m3 btn-m3-filled md-ripple" rel="noopener noreferrer">
        <span class="material-symbols-outlined">code</span>
        <span>Open GitHub Repository</span>
      </a>
    </div>
  </div>
</div>
